name: Build and security regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore TokenVault.sln
      - run: dotnet build TokenVault.sln -c Release --no-restore
      - run: dotnet run --project tests/TokenVault.Tests -c Release --no-build
      - if: runner.os == 'Windows'
        run: dotnet publish src/TokenVault.Vault -c Release -r win-x64 --self-contained true -o artifacts/Vault
      - if: runner.os == 'Windows'
        run: dotnet publish src/TokenVault.Launcher -c Release -r win-x64 --self-contained true -o artifacts/Launcher
