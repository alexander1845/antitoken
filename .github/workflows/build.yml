name: Build and security regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env: # only whether a certificate exists; the secrets themselves stay in the signing step
      HAS_SIGNING_CERT: ${{ secrets.SIGNING_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore TokenVault.sln
      - run: dotnet build TokenVault.sln -c Release --no-restore
      - run: dotnet run --project tests/TokenVault.Tests -c Release --no-build
      # Release builds take their version from the tag (the updater compares versions). The update public key and the
      # PostHog project key come from Directory.Build.props; repository VARIABLES of the same name override them
      # (both values are public by design):
      #   UPDATE_PUBLIC_KEY    base64 public key from scripts/New-UpdateSigningKey.ps1
      #   POSTHOG_PROJECT_KEY  PostHog PROJECT key, phc_... Never a phx_ personal key.
      - if: runner.os == 'Windows'
        shell: bash
        env:
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
          POSTHOG_PROJECT_KEY: ${{ vars.POSTHOG_PROJECT_KEY }}
        run: |
          args=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Release tags must look like v1.2.3"; exit 1; }
            args+=("-p:Version=$version")
          fi
          if [[ -n "$UPDATE_PUBLIC_KEY" ]]; then args+=("-p:TokenVaultUpdatePublicKey=$UPDATE_PUBLIC_KEY"); fi
          if [[ -n "$POSTHOG_PROJECT_KEY" ]]; then
            [[ "$POSTHOG_PROJECT_KEY" == phc_* ]] || { echo "POSTHOG_PROJECT_KEY must be a PostHog project key (phc_...)"; exit 1; }
            args+=("-p:PostHogProjectKey=$POSTHOG_PROJECT_KEY")
          fi
          dotnet publish src/TokenVault.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none \
            -o artifacts/TokenVault "${args[@]}"
      # Authenticode signing, only when a certificate is configured as repository secrets:
      #   SIGNING_CERT_PFX_BASE64  base64 of the .pfx   SIGNING_CERT_PASSWORD  its password
      # Signed builds stop Windows SmartScreen from naming an "unknown publisher". See README, "Windows warning".
      - if: runner.os == 'Windows' && env.HAS_SIGNING_CERT == 'true'
        env:
          SIGNING_CERT_PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERT_PFX_BASE64))
          try {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:SIGNING_CERT_PASSWORD artifacts/TokenVault/TokenVault.exe
            if ($LASTEXITCODE -ne 0) { throw 'Signing failed' }
          } finally { Remove-Item $pfx -Force }
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: TokenVault-win-x64
          path: artifacts/TokenVault

  # Pushing a tag such as v1.0.0 publishes a GitHub release with the Windows build attached.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Directory.Build.props
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: TokenVault-win-x64
          path: TokenVault
      - run: zip -r TokenVault-win-x64.zip TokenVault
      # The signed manifest is what lets installed copies update themselves. The private key is only used here, from the
      # UPDATE_SIGNING_KEY secret; the signature is checked against UPDATE_PUBLIC_KEY before anything is published.
      - name: Sign the update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
        run: |
          if [[ -z "$UPDATE_PUBLIC_KEY" ]]; then
            UPDATE_PUBLIC_KEY=$(sed -n 's:.*<TokenVaultUpdatePublicKey[^>]*>\([A-Za-z0-9+/=]*\)</TokenVaultUpdatePublicKey>.*:\1:p' Directory.Build.props)
          fi
          if [[ -z "$UPDATE_SIGNING_KEY" || -z "$UPDATE_PUBLIC_KEY" ]]; then
            echo "::warning::UPDATE_SIGNING_KEY secret (or the public key) is missing: this release can't be installed automatically."
            exit 0
          fi
          umask 077
          version="${GITHUB_REF_NAME#v}"
          size=$(stat -c%s TokenVault-win-x64.zip)
          sha=$(sha256sum TokenVault-win-x64.zip | cut -d' ' -f1)
          printf '{"product":"TokenVault","version":"%s","file":"TokenVault-win-x64.zip","sha256":"%s","size":%s}' "$version" "$sha" "$size" > TokenVault-update.json
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/signing.pem"
          openssl dgst -sha256 -sign "$RUNNER_TEMP/signing.pem" -out "$RUNNER_TEMP/manifest.sig" TokenVault-update.json
          rm -f "$RUNNER_TEMP/signing.pem"
          { echo "-----BEGIN PUBLIC KEY-----"; echo "$UPDATE_PUBLIC_KEY" | fold -w 64; echo "-----END PUBLIC KEY-----"; } > "$RUNNER_TEMP/public.pem"
          openssl dgst -sha256 -verify "$RUNNER_TEMP/public.pem" -signature "$RUNNER_TEMP/manifest.sig" TokenVault-update.json
          base64 -w0 "$RUNNER_TEMP/manifest.sig" > TokenVault-update.json.sig
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            TokenVault-win-x64.zip
            TokenVault-update.json
            TokenVault-update.json.sig
          generate_release_notes: true
